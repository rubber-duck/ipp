name: Data authoring through real clients
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned tools and Chromium
        run: |
          python tools/ipp.py setup rust
          python tools/ipp.py setup node
          python tools/ipp.py setup python
          python tools/ipp.py setup browser --with-deps
      - name: Validate native, worker and completed driver frames
        run: python tools/ipp.py regression --only test:datasets:combined-native --only test:datasets:combined-worker --only test:datasets:driver-render --only test:datasets:react-native --only test:datasets:react-worker --software
      - name: Preserve identities, failures and frame artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-authoring-evidence
          path: |
            target/pipeline/runs/
            target/integration-artifacts/
          if-no-files-found: warn
