name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned Python development tools
        run: python tools/ipp.py setup python
      - name: Validate repository and pipeline
        run: python tools/ipp.py regression --profile repository
      - name: Preserve pipeline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository
          path: target/pipeline/runs/
          if-no-files-found: warn

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install repository-pinned Rust toolchain
        run: python tools/ipp.py setup rust
      - name: Check native workspace through the regression entry point
        run: python tools/ipp.py regression --profile native
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.os }}
          path: target/pipeline/runs/
          if-no-files-found: warn

  headless-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install repository-pinned Rust toolchain
        run: python tools/ipp.py setup rust
      - name: Install locked JavaScript development tools
        run: python tools/ipp.py setup node
      - name: Install pinned Python development tools
        run: python tools/ipp.py setup python
      - name: Install Chromium and its system dependencies
        run: python tools/ipp.py setup browser --with-deps
      - name: Prepare pinned Blender and trusted localhost certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools libxi6 libxrender1 libxkbcommon0 libgl1 libegl1-mesa-dev libgles2-mesa-dev libegl-mesa0 libgl1-mesa-dri
          python tools/ipp.py setup blender
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          TRUST_STORES=nss python tools/ipp.py setup certificates --install-trust
      - name: Run full regression through the maintained entry point
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          IPP_EGL_LIBRARY_DIR: /usr/lib/x86_64-linux-gnu
        run: python tools/ipp.py regression --profile integration
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headless-integration
          path: |
            target/pipeline/runs/
            target/integration-artifacts/
            target/browser-build/*/build-report.json
            target/protocol-client-tests/
            target/react-build/build-report.json
            target/canvas-build/build-report.json
            target/gallery-build/*-report.json
            target/gallery-fixtures/*-report.json
            target/texture-build/build-report.json
            target/shapes-build/build-report.json
            target/surface-build/build-report.json
            target/blender-viewer/build-report.json
          if-no-files-found: warn
