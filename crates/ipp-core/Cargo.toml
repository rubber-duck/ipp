[package]
name = "ipp-core"
description = "Headless IPP state, lifecycle, and evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ipp-schema-derive.workspace = true
miniz_oxide = { workspace = true, optional = true }
# Complete UAX #29 segmentation for preserved source text; see
# world/systems/surface/text.rs. Optional so lean builds without `gui` keep
# the dependency-free basic-LTR subset for plain Surface labels.
unicode-segmentation = { workspace = true, optional = true }

[dev-dependencies]
ipp-core = { workspace = true, features = ["checked-invariants"] }

[features]
profiling = []
mesh-poses = []
particles = []
surfaces = []
gui = ["surfaces", "dep:unicode-segmentation"]
default = ["builtin-assets"]
diagnostics = []
builtin-assets = []
skeletal-animation = []
zip-data-source = ["dep:miniz_oxide"]
shadows = []
# Test-only oracle: assert (panic) after each commit that every committed
# component passes whole-component validation. It never changes a batch result.
# Only the self dev-dependency below enables it, for ipp-core's own unit and
# integration test targets; it must never appear in a build profile or in a
# dependent crate's feature list.
checked-invariants = []

[lints]
workspace = true

[[example]]
name = "export_builtin"
required-features = ["builtin-assets"]
