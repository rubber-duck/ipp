[package]
name = "ipp-render-gl"
description = "IPP rendering shared by WebGL 2 and OpenGL ES 3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ipp-core.workspace = true

[features]
default = []
instrumentation = ["ipp-core/instrumentation"]

[lints]
workspace = true

# Targets that set renderer testing overrides need `instrumentation`.
[[example]]
name = "egl_publications"
required-features = ["instrumentation"]

[[example]]
name = "egl_surface_cache"
required-features = ["instrumentation"]

[[test]]
name = "mesh_residency"
required-features = ["instrumentation"]

[[test]]
name = "surface_cache"
required-features = ["instrumentation"]

[[test]]
name = "gpu_profiling"
required-features = ["instrumentation"]
