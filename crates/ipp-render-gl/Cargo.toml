[package]
name = "ipp-render-gl"
description = "IPP rendering shared by WebGL 2 and OpenGL ES 3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ipp-core.workspace = true

[features]
surfaces = ["ipp-core/surfaces"]
gui = ["ipp-core/gui", "surfaces"]
profiling = ["ipp-core/profiling"]
diagnostics = ["ipp-core/diagnostics"]
mesh-poses = ["ipp-core/mesh-poses"]
particles = ["ipp-core/particles"]
default = []
shadows = ["ipp-core/shadows"]
skeletal-animation = ["ipp-core/skeletal-animation"]

[lints]
workspace = true

[[example]]
name = "egl_smoke"
required-features = ["diagnostics"]

[[example]]
name = "egl_publications"
required-features = ["diagnostics"]

[[example]]
name = "egl_custom_materials"
required-features = ["diagnostics"]

[[example]]
name = "egl_skinning"
required-features = ["skeletal-animation", "diagnostics"]

[[example]]
name = "egl_mesh_poses"
required-features = ["mesh-poses", "diagnostics"]

[[example]]
name = "egl_particles"
required-features = ["particles", "diagnostics"]

[[example]]
name = "egl_surfaces"
required-features = ["surfaces", "diagnostics"]

[[example]]
name = "egl_gui_clips"
required-features = ["gui", "diagnostics"]

[[example]]
name = "egl_gui_layout"
required-features = ["gui", "diagnostics"]

[[example]]
name = "egl_surface_cache"
required-features = ["gui", "diagnostics"]

# Integration tests read renderer statistics and use its testing overrides.
[[test]]
name = "mesh_residency"
required-features = ["diagnostics"]

[[test]]
name = "publication_rendering"
required-features = ["diagnostics"]

[[test]]
name = "selected_preparation"
required-features = ["diagnostics"]

[[test]]
name = "surface_cache"
required-features = ["diagnostics"]
