[package]
name = "ipp-render-webgpu"
description = "WebGPU rendering of completed Camera and Canvas publications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(any(target_os = "macos", target_arch = "wasm32"))'.dependencies]
ipp-core.workspace = true
ipp-render-scene.workspace = true
bytemuck.workspace = true
futures-lite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["OffscreenCanvas"] }

[features]
default = []
instrumentation = ["ipp-core/instrumentation"]

[lints]
workspace = true
