[package]
name = "ipp-server"
description = "IPP native host foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ipp-core.workspace = true
ipp-host-session.workspace = true
ipp-protocol.workspace = true
tungstenite.workspace = true
async-io.workspace = true
async-channel.workspace = true
futures-lite.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
memmap2.workspace = true
libc.workspace = true

[features]
default = []
instrumentation = ["ipp-core/instrumentation", "ipp-protocol/instrumentation", "ipp-host-session/instrumentation", "ipp-render-gl/instrumentation"]

# The scene profiling example and the GLES testing host drive the native renderer
# and read its statistics; the server itself does not render. With
# `instrumentation`, the GLES test host honours testing controls and the scene
# profiler counts allocations and stage timings.
[dev-dependencies]
ipp-render-gl.workspace = true

[lints]
workspace = true
