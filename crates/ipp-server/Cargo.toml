[package]
name = "ipp-server"
description = "IPP native host foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ipp-core.workspace = true
ipp-host-session.workspace = true
ipp-protocol.workspace = true
tungstenite = { workspace = true, optional = true }

[features]
gui = [
    "surfaces",
    "ipp-protocol/gui",
    "ipp-host-session/gui",
]
surfaces = ["ipp-protocol/surfaces", "ipp-host-session/surfaces"]
profiling = ["ipp-protocol/profiling", "ipp-host-session/profiling", "ipp-render-gl/profiling"]
mesh-poses = ["ipp-protocol/mesh-poses", "ipp-host-session/mesh-poses"]
particles = ["ipp-protocol/particles", "ipp-host-session/particles"]
default = ["builtin-assets"]
diagnostics = ["ipp-core/diagnostics", "ipp-host-session/diagnostics"]
builtin-assets = ["ipp-protocol/builtin-assets", "ipp-host-session/builtin-assets"]
websocket = ["dep:tungstenite"]
skeletal-animation = ["ipp-protocol/skeletal-animation", "ipp-host-session/skeletal-animation"]
shadows = ["ipp-host-session/shadows"]

# The scene profiling example drives the native renderer; the server itself does not.
[dev-dependencies]
ipp-render-gl = { workspace = true, features = [
    "diagnostics",
    "mesh-poses",
    "particles",
    "shadows",
    "skeletal-animation",
] }

[lints]
workspace = true

[[bin]]
name = "ipp-server"
path = "src/main.rs"
required-features = ["websocket"]

[[example]]
name = "profile_scene"
required-features = ["shadows", "skeletal-animation", "mesh-poses", "particles"]
