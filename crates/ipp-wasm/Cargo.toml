[package]
name = "ipp-wasm"
description = "IPP browser worker host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ipp-core.workspace = true
ipp-host-session.workspace = true
ipp-protocol.workspace = true
ipp-render-gl = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ipp-render-webgpu = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["OffscreenCanvas"] }

[features]
default = []
instrumentation = [
    "ipp-core/instrumentation",
    "ipp-protocol/instrumentation",
    "ipp-host-session/instrumentation",
    "ipp-render-gl?/instrumentation",
    "ipp-render-webgpu?/instrumentation",
]
webgpu = ["dep:ipp-render-webgpu", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
render = ["dep:ipp-render-gl"]

[lints]
workspace = true
