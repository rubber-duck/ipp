<!doctype html><meta charset="utf-8"><title>IPP native CEF fixture</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent }
#panel { position:absolute; inset:0; background:rgba(255,0,0,.5) }
#marker { position:absolute; left:0; top:0; width:24px; height:16px; background:lime }
button { position:absolute; left:48px; top:32px; width:32px; height:24px; background:white; border:0 }
input { position:absolute; left:96px; top:32px; width:80px; height:24px; border:0 }
a { position:absolute; left:0; top:80px }
</style>
<div id="panel"></div><div id="marker"></div><button id="change">Go</button><input id="edit"><a href="replacement.html">Next page</a>
<canvas width="16" height="16" style="position:absolute;left:96px;top:104px"></canvas>
<script>
const canvas = document.querySelector("canvas").getContext("2d"); canvas.fillStyle="#ff8000"; canvas.fillRect(0,0,16,16);
const update = () => { document.querySelector('#panel').style.background='rgba(0,255,0,.5)'; document.querySelector('#marker').style.background='red'; };
document.querySelector('#change').addEventListener('click', update);
document.querySelector('#edit').addEventListener('input', () => { document.querySelector('#marker').style.background=document.querySelector('#edit').value==='CEF' ? 'yellow' : 'white'; });
</script>
